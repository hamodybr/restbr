<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080604">
  <title>QR • SHORASH</title>
  <style>
    :root{--gold:#d8a958;--line:rgba(216,169,88,.42)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#080604;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Arial,sans-serif}
    body{min-height:100dvh;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 10%,#28190d 0,#0b0805 43%,#050403 100%)}
    .card{width:min(390px,100%);position:relative;border:1px solid var(--line);border-radius:28px;padding:24px 20px 20px;text-align:center;background:rgba(10,8,6,.58);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 25px 70px rgba(0,0,0,.45)}
    .logo{width:82px;height:82px;display:block;object-fit:cover;border-radius:50%;margin:0 auto 12px;border:1px solid rgba(216,169,88,.48);box-shadow:0 12px 32px rgba(0,0,0,.4)}
    h1{margin:0;color:#f5efe8;font-size:22px;line-height:1.25}.sub{margin:6px 0 0;color:#a89c8e;font-size:11px;letter-spacing:2px}
    .line{width:90px;height:1px;margin:17px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
    .qr{width:min(286px,100%);aspect-ratio:1;background:#fff;border-radius:22px;padding:15px;margin:0 auto 18px;box-shadow:0 14px 38px rgba(0,0,0,.35)}.qr img{display:block;width:100%;height:100%;object-fit:contain}
    .url{margin:0 auto 17px;color:#8e8275;font-size:9px;line-height:1.45;word-break:break-all;max-width:290px}
    .btns{display:grid;gap:8px}.btn{width:100%;min-height:48px;border-radius:15px;font-weight:900;border:1px solid var(--line);font-size:12px}.gold{border:0;background:linear-gradient(135deg,#efc76e,#b8792c);color:#160f07}.dark{background:rgba(0,0,0,.24);color:#eee}.mini{min-height:42px;color:#d9ad5a;background:rgba(0,0,0,.14)}
    .toast{position:fixed;left:50%;bottom:calc(25px + env(safe-area-inset-bottom));transform:translate(-50%,10px);opacity:0;transition:.2s;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:#17120d;color:#efc76e;font-size:10px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body>
  <main class="card">
    <img id="logo" class="logo" alt="">
    <h1 id="name">SHORASH</h1>
    <div class="sub">DIGITAL MENU</div>
    <div class="line"></div>
    <div class="qr"><img id="qr" alt="QR Code"></div>
    <div id="url" class="url"></div>
    <div class="btns">
      <button id="share" class="btn gold" type="button">مشاركة / حفظ QR</button>
      <button id="copy" class="btn mini" type="button">نسخ رابط المنيو</button>
      <button class="btn dark" type="button" onclick="location.href='./'">العودة للمنيو</button>
    </div>
  </main>
  <div id="toast" class="toast">تم النسخ</div>
<script>
(async()=>{
  const c=await fetch('data/restaurant.json',{cache:'no-store'}).then(r=>r.json());
  const lang=localStorage.getItem(`restbr-simple-lang:${c.slug||'menu'}`)||c.defaultLanguage||'ar';
  const name=c.name?.[lang]||c.name?.ar||c.name?.en||'SHORASH';
  document.documentElement.lang=lang;
  document.documentElement.dir=(lang==='en'?'ltr':'rtl');
  document.getElementById('name').textContent=name;
  const logo=document.getElementById('logo');logo.src=c.logo||'';logo.alt=name;
  const menuUrl=new URL('./',location.href).toString();
  document.getElementById('url').textContent=menuUrl;
  const qrSrc='https://api.qrserver.com/v1/create-qr-code/?size=1024x1024&margin=24&data='+encodeURIComponent(menuUrl);
  const img=document.getElementById('qr');img.src=qrSrc;
  const labels={
    ar:{share:'مشاركة / حفظ QR',copy:'نسخ رابط المنيو',copied:'تم نسخ الرابط'},
    ku:{share:'پاراستن / هاوبەشکردنی QR',copy:'کۆپیکردنی لینکی مینیو',copied:'لینک کۆپی کرا'},
    en:{share:'Share / Save QR',copy:'Copy menu link',copied:'Link copied'}
  }[lang]||{};
  document.getElementById('share').textContent=labels.share||'Share / Save QR';
  document.getElementById('copy').textContent=labels.copy||'Copy menu link';
  function toast(){const t=document.getElementById('toast');t.textContent=labels.copied||'Copied';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
  document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(menuUrl)}catch(_){const a=document.createElement('textarea');a.value=menuUrl;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast()};
  document.getElementById('share').onclick=async()=>{
    try{
      const blob=await fetch(qrSrc).then(r=>{if(!r.ok)throw new Error('QR');return r.blob()});
      const file=new File([blob],`${c.slug||'restaurant'}-menu-qr.png`,{type:'image/png'});
      if(navigator.canShare?.({files:[file]})){
        await navigator.share({files:[file],title:name,text:menuUrl});
      }else if(navigator.share){
        await navigator.share({title:name,url:menuUrl});
      }else{
        const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),1500);
      }
    }catch(e){if(e?.name!=='AbortError')window.open(qrSrc,'_blank')}
  };
})();
</script>
</body>
</html>
