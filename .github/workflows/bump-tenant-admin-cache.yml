name: Bump Tenant Admin Cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-tenant-admin-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump tenant admin script versions
        run: |
          python - <<'PY'
          from pathlib import Path

          admin = Path('tenant-template/admin.html')
          text = admin.read_text(encoding='utf-8')
          old = 'js/supabase-config.js?v=1.0'
          if old not in text:
              raise SystemExit('admin supabase-config version marker not found')
          admin.write_text(text.replace(old, 'js/supabase-config.js?v=2.0', 1), encoding='utf-8')

          cfg = Path('tenant-template/js/supabase-config.js')
          text = cfg.read_text(encoding='utf-8')
          old = "script.src = 'js/admin-font-scale.js?v=1.0';"
          if old not in text:
              raise SystemExit('admin font scale version marker not found')
          cfg.write_text(text.replace(old, "script.src = 'js/admin-font-scale.js?v=1.1';", 1), encoding='utf-8')
          PY

      - name: Syntax check
        run: |
          node --check tenant-template/js/supabase-config.js
          node --check tenant-template/js/admin-font-scale.js
          node --check tenant-template/js/admin-role-ui.js

      - name: Commit cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tenant-template/admin.html tenant-template/js/supabase-config.js
          git commit -m 'Force fresh tenant admin compatibility scripts'
          git push origin HEAD:main
