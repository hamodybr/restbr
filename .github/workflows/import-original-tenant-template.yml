name: Import Original RESTBR Menu Template

on:
  push:
    branches: [tmp-6a-original-admin-multitenant]
    paths:
      - '.github/workflows/import-original-tenant-template.yml'

permissions:
  contents: write

jobs:
  import-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RESTBR
        uses: actions/checkout@v4
        with:
          ref: tmp-6a-original-admin-multitenant
          fetch-depth: 0

      - name: Clone original restbr-menu-app
        run: git clone --depth 1 --branch main https://github.com/hamodybr/restbr-menu-app.git /tmp/restbr-menu-app

      - name: Copy exact original application
        run: |
          set -euo pipefail
          rm -rf tenant-template
          mkdir -p tenant-template
          cp /tmp/restbr-menu-app/index.html tenant-template/index.html
          cp /tmp/restbr-menu-app/admin.html tenant-template/admin.html
          cp /tmp/restbr-menu-app/manifest.webmanifest tenant-template/manifest.webmanifest
          cp /tmp/restbr-menu-app/sw.js tenant-template/sw.js
          cp -R /tmp/restbr-menu-app/assets tenant-template/assets
          cp -R /tmp/restbr-menu-app/css tenant-template/css
          cp -R /tmp/restbr-menu-app/js tenant-template/js

      - name: Replace only Supabase connection with tenant compatibility layer
        run: |
          python - <<'PY'
          from pathlib import Path
          cfg=Path('tenant-template/js/supabase-config.js')
          original=cfg.read_text(encoding='utf-8')
          marker="console.log('✅ SHORASH Supabase connected');"
          pos=original.find(marker)
          if pos < 0:
              raise SystemExit('Original Supabase marker not found')
          rest=original[pos+len(marker):]
          preamble=Path('multitenant/tenant-supabase-preamble.js').read_text(encoding='utf-8').rstrip()
          cfg.write_text(preamble+'\n'+rest.lstrip('\n'),encoding='utf-8')

          admin=Path('tenant-template/admin.html')
          text=admin.read_text(encoding='utf-8')
          text=text.replace('<title>SHORASH — Admin Dashboard</title>','<title>RESTBR — Admin Dashboard</title>',1)
          admin.write_text(text,encoding='utf-8')
          PY

      - name: JavaScript syntax check
        run: |
          set -euo pipefail
          node --check tenant-template/js/supabase-config.js
          for file in tenant-template/js/*.js; do node --check "$file"; done

      - name: Commit imported template
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tenant-template
          git commit -m 'Import original menu and admin as multi-tenant template'
          git push origin HEAD:tmp-6a-original-admin-multitenant
