name: Tenant Public Isolation Fix V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tenant-public-isolation-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch tenant public isolation
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('tenant-template/js/app.js')
          text = app.read_text(encoding='utf-8')

          marker = 'let searchTracked = false;\n'
          insert = '''let searchTracked = false;

const restbrTenantCacheId=()=>String(
  window.RESTBR_TENANT_ID ||
  new URLSearchParams(location.search).get("rid") ||
  new URLSearchParams(location.search).get("restaurant_id") ||
  ""
).trim();

function restbrTenantCacheKey(suffix){
  const rid=restbrTenantCacheId();
  return rid ? `RESTBR:${rid}:${suffix}` : "";
}
'''
          if marker not in text:
              raise SystemExit('app marker not found')
          text = text.replace(marker, insert, 1)

          old = '''  const key=`shorash:view:${day}`;

  if(sessionStorage.getItem(key))return;

  sessionStorage.setItem(key,"1");'''
          new = '''  const key=restbrTenantCacheKey(`view:${day}`);

  if(!key)return;
  if(sessionStorage.getItem(key))return;

  sessionStorage.setItem(key,"1");'''
          if old not in text:
              raise SystemExit('view cache marker not found')
          text = text.replace(old, new, 1)

          old = '''function saveMenuOfflineCache(db){
  try{
    localStorage.setItem(
      "SHORASH_MENU_OFFLINE_CACHE_V1",
      JSON.stringify({
        saved_at:Date.now(),
        db
      })
    );
  }catch(_){}
}


function loadMenuOfflineCache(){
  try{
    const raw=localStorage.getItem("SHORASH_MENU_OFFLINE_CACHE_V1");
    if(!raw)return null;'''
          new = '''function saveMenuOfflineCache(db){
  try{
    const key=restbrTenantCacheKey("MENU_OFFLINE_CACHE_V1");
    if(!key)return;
    localStorage.setItem(
      key,
      JSON.stringify({
        saved_at:Date.now(),
        restaurant_id:restbrTenantCacheId(),
        db
      })
    );
  }catch(_){}
}


function loadMenuOfflineCache(){
  try{
    const key=restbrTenantCacheKey("MENU_OFFLINE_CACHE_V1");
    if(!key)return null;
    const raw=localStorage.getItem(key);
    if(!raw)return null;'''
          if old not in text:
              raise SystemExit('offline cache marker not found')
          text = text.replace(old, new, 1)

          old = '''    if(
      !parsed?.db ||
      !Array.isArray(parsed.db.products)
    ) return null;

    return parsed.db;'''
          new = '''    if(
      !parsed?.db ||
      !Array.isArray(parsed.db.products) ||
      String(parsed.restaurant_id||"") !== restbrTenantCacheId()
    ) return null;

    return parsed.db;'''
          if old not in text:
              raise SystemExit('offline validation marker not found')
          text = text.replace(old, new, 1)

          old = '''    navigator.serviceWorker
        .register("./sw.js")
        .catch(error=>console.debug("SW:",error));'''
          new = '''    navigator.serviceWorker
        .register("./sw.js?v=restbr-tenant-v2",{updateViaCache:"none"})
        .catch(error=>console.debug("SW:",error));'''
          if old not in text:
              raise SystemExit('service worker registration marker not found')
          text = text.replace(old, new, 1)

          old = '''    localStorage.setItem(
      "SHORASH_BRAND_CACHE_V1",
      JSON.stringify({'''
          new = '''    const key=restbrTenantCacheKey("BRAND_CACHE_V1");
    if(!key)return;
    localStorage.setItem(
      key,
      JSON.stringify({'''
          if old not in text:
              raise SystemExit('brand cache marker not found')
          text = text.replace(old, new, 1)

          old = '''  const alreadySeen=
    sessionStorage.getItem(
      "shorashIntroSeen"
    );'''
          new = '''  const introKey=restbrTenantCacheKey("introSeen");

  const alreadySeen=
    introKey ? sessionStorage.getItem(introKey) : null;'''
          if old not in text:
              raise SystemExit('intro read marker not found')
          text = text.replace(old, new, 1)

          old = '''  sessionStorage.setItem(
    "shorashIntroSeen",
    "1"
  );'''
          new = '''  if(introKey){
    sessionStorage.setItem(
      introKey,
      "1"
    );
  }'''
          if old not in text:
              raise SystemExit('intro write marker not found')
          text = text.replace(old, new, 1)

          start = text.index('async function loadMenuFallback() {')
          end = text.index('\n\n\n/* ========================================\n   START SHORASH', start)
          replacement = '''async function loadMenuFallback() {
  // RESTBR tenant safety: never load copied SHORASH static data.
  // Offline fallback is allowed only from the restaurant-scoped cache.
  throw new Error("RESTBR static cross-tenant fallback disabled");
}
'''
          text = text[:start] + replacement + text[end:]

          old = '''    console.error(
      "SHORASH MENU ERROR:",
      error
    );


    const menu ='''
          new = '''    console.error(
      "SHORASH MENU ERROR:",
      error
    );

    window.__RESTBR_BOOT_ERROR=String(error?.message||error||"Unknown menu error");
    window.dispatchEvent(new CustomEvent("shorash:error",{detail:{message:window.__RESTBR_BOOT_ERROR}}));


    const menu ='''
          if old not in text:
              raise SystemExit('app error marker not found')
          text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          index = Path('tenant-template/index.html')
          text = index.read_text(encoding='utf-8')
          old = '        const raw=localStorage.getItem("SHORASH_BRAND_CACHE_V1");'
          new = '''        const rid=String(
          new URLSearchParams(location.search).get("rid") ||
          new URLSearchParams(location.search).get("restaurant_id") ||
          ""
        ).trim();
        if(!rid)return;
        const raw=localStorage.getItem(`RESTBR:${rid}:BRAND_CACHE_V1`);'''
          if old not in text:
              raise SystemExit('index brand cache marker not found')
          text = text.replace(old, new, 1)
          text = text.replace('js/supabase-config.js?v=1.3', 'js/supabase-config.js?v=3.0', 1)
          text = text.replace('js/dining-mode.js?v=1.3', 'js/dining-mode.js?v=1.4', 1)
          text = text.replace('js/app.js?v=17.3', 'js/app.js?v=18.0', 1)
          index.write_text(text, encoding='utf-8')

          dining = Path('tenant-template/js/dining-mode.js')
          text = dining.read_text(encoding='utf-8')
          marker = '''  window.addEventListener('shorash:ready', () => {
    subscribePrices();
    if (selectedMode) void finishSelection();
  });'''
          replacement = '''  window.addEventListener('shorash:ready', () => {
    subscribePrices();
    if (selectedMode) void finishSelection();
  });

  window.addEventListener('shorash:error', event => {
    gate?.classList.remove('loading');
    const loading = gate?.querySelector('.sm-dining-loading');
    const raw = String(event?.detail?.message || 'unknown').slice(0,140);
    if (loading) {
      loading.style.display = 'block';
      loading.textContent = lang() === 'en'
        ? `Menu loading failed: ${raw}`
        : lang() === 'ku'
          ? `مینیو بارنەبوو: ${raw}`
          : `تعذر تحميل المنيو: ${raw}`;
    }
    console.error('RESTBR public menu boot failed:', raw);
  });'''
          if marker not in text:
              raise SystemExit('dining ready marker not found')
          text = text.replace(marker, replacement, 1)
          dining.write_text(text, encoding='utf-8')

          sw = Path('tenant-template/sw.js')
          text = sw.read_text(encoding='utf-8')
          text = text.replace('const CACHE_NAME = "shorash-menu-restored-v44";', 'const CACHE_NAME = "restbr-tenant-template-v2";', 1)
          text = text.replace('"./js/app.js?v=17.3"', '"./js/app.js?v=18.0"', 1)
          text = text.replace('"./js/supabase-config.js?v=1.3"', '"./js/supabase-config.js?v=3.0"', 1)
          text = text.replace('"./js/dining-mode.js?v=1.3"', '"./js/dining-mode.js?v=1.4"', 1)
          text = text.replace('"./js/admin-takeaway-prices.js?v=1.1"', '"./js/admin-takeaway-prices.js?v=1.2"', 1)
          text = text.replace('  "./data/menu.json?v=32",\n', '', 1)
          old = '''      keys
        .filter(key => key !== CACHE_NAME)
        .map(key => caches.delete(key))'''
          new = '''      keys
        .filter(key => key.startsWith("restbr-tenant-template-") && key !== CACHE_NAME)
        .map(key => caches.delete(key))'''
          if old not in text:
              raise SystemExit('sw activation marker not found')
          text = text.replace(old, new, 1)
          sw.write_text(text, encoding='utf-8')
          PY

      - name: Syntax and isolation checks
        run: |
          node --check tenant-template/js/app.js
          node --check tenant-template/js/dining-mode.js
          node --check tenant-template/js/supabase-config.js
          node --check tenant-template/sw.js
          grep -q 'RESTBR static cross-tenant fallback disabled' tenant-template/js/app.js
          grep -q 'restbr-tenant-template-v2' tenant-template/sw.js
          grep -q 'supabase-config.js?v=3.0' tenant-template/index.html
          grep -q 'app.js?v=18.0' tenant-template/index.html
          ! grep -q 'SHORASH_MENU_OFFLINE_CACHE_V1' tenant-template/js/app.js

      - name: Commit fix and remove one-time workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tenant-template/index.html tenant-template/js/app.js tenant-template/js/dining-mode.js tenant-template/sw.js
          git rm -f .github/workflows/tenant-public-isolation-fix.yml .github/workflows/tenant-public-isolation-fix-v2.yml
          git commit -m 'Isolate public tenant cache and surface boot errors'
          git push origin HEAD:main
