name: Build RESTBR Router V3.4

on:
  push:
    branches: [tmp-5b-control-center]
    paths:
      - '.github/workflows/build-router-v3-4.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 5B branch
        uses: actions/checkout@v4
        with:
          ref: tmp-5b-control-center
          fetch-depth: 0

      - name: Build V3.4 from tested V3.3 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare
          src='https://raw.githubusercontent.com/hamodybr/restbr-menu-app/tmp-5a-multitenant-recovery/cloudflare/restbr-router-v3.2-worker.js'
          curl --fail --silent --show-error --location "$src" --output cloudflare/restbr-router-v3.4-worker.js
          sed -i 's/RESTBR Router V3\.3/RESTBR Router V3.4/g' cloudflare/restbr-router-v3.4-worker.js
          sed -i 's/version: 3\.3/version: 3.4/g' cloudflare/restbr-router-v3.4-worker.js
          sed -i 's/routerVersion: 3\.3/routerVersion: 3.4/g' cloudflare/restbr-router-v3.4-worker.js
          sed -i 's/"v3\.3"/"v3.4"/g' cloudflare/restbr-router-v3.4-worker.js
          sed -i 's#const ADMIN_BASE_PATH = "/restbr-menu-app/admin";#const ADMIN_BASE_PATH = "/restbr/control-center";#' cloudflare/restbr-router-v3.4-worker.js

      - name: Guard V3.4 scope
        shell: bash
        run: |
          set -euo pipefail
          file=cloudflare/restbr-router-v3.4-worker.js
          grep -q 'const ADMIN_HOST = "admin.restbr.com"' "$file"
          grep -q 'const ADMIN_ORIGIN = "https://hamodybr.github.io"' "$file"
          grep -q 'const ADMIN_BASE_PATH = "/restbr/control-center"' "$file"
          grep -q 'routerVersion: 3.4' "$file"
          grep -q 'router_origin' "$file"
          grep -q 'router_base_path' "$file"
          ! grep -q 'const ADMIN_BASE_PATH = "/restbr-menu-app/admin"' "$file"
          node --check "$file"

      - name: Commit router source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RESTBR 5B Router Build'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare/restbr-router-v3.4-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add RESTBR Router V3.4 isolated admin origin'
          git push origin HEAD:tmp-5b-control-center
